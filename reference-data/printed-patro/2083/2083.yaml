  - id: griharambha
    name: "Griharambha"
    nameNp: "गृहारम्भ"
    details: |
      कर्ताको सूर्य, बृहस्पति, चन्द्रमा बली भई जामित्र विवाहोक्त दोष सम्पूर्ण छाडी रवि, मङ्गलवार चरलग्न चरांशक, ४,९,१४ तिथि छाडी रो.मृ.ति. ३ उत्तरा, ह. चि. स्वा. अनु. ध. श. रे. यी १३ नक्षत्रमा पौष, फाल्गुन, वैशाख, श्रावण, कार्तिक, मार्गशीर्ष महिनामा वृषवास्तु चक्र जुराई गृहारम्भ गर्नु ।

  - id: shilanyas
    name: "Shilanyas"
    nameNp: "शिलान्यास"
