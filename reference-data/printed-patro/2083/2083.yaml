# Panchanga muhurta prakaran (मुहूर्त प्रकरण) + samaya suddhi (समय शुद्धि) for BS 2083.
# Source: सूर्यपञ्चाङ्ग मुहूर्त प्रकरण. `details` is verbatim Devanagari reference text;
# only the title (name / nameNp) toggles script in the app. Regenerate the JSON with
# `make generate-prakaran` after editing.

samayaSuddhi: "आषाढ ३२ गते बिहिवार गुरु पश्चिममा अस्त १८ः५९ = दिँउसो १२ः५५ पछी\nश्रावण २४ गते आइतवार गुरुः पूर्वमा उदाउने १७ः११ = दिँउसो १२ः२४ पछी\nआश्विन २८ गते बुधवार शुक्र पश्चिममा अस्त १८ः५९ = दिँउसो १२ः४० पछी\nकार्तिक ११ गते बुधवार  शुक्र पूर्वमा उदाउने ४६ः३२ = राती २४ः४९ पछि"

prakarans:
  - id: chuda
    name: "Chuda (Chhewar)"
    nameNp: "चूडा (छेवर)"
    details: |
      जन्मदेखि विजोर ३।५।७ वर्षमा ८।१२ रिक्ता तिथि, चैत्रमास, पर्वदिन (अष्टमी, चतुर्दशी, औंसी, पूर्णिमा र संक्रान्ति), जन्मराशि र लग्नदेखि अष्टम लग्न छाडी उत्तरायण सोम, बुध, गुरू, शुक्रवार अश्वि. मृ. पु. ति. ह. चि. स्वा.ज्ये.श्र.ध.श.रे. नक्षत्रमा ३।६।११ (लग्नदेखि) मा पापग्रह अष्टम स्थान शुद्ध गरी शुभ लग्न, शुभांशकमा चूडा (छेवर) गर्नु ।

  - id: annaprashan
    name: "Annaprashan (Pasni)"
    nameNp: "अन्नप्राशन (पास्नी)"
    details: |
      छोराको ६ र छोरीको ५ महिनामा अन्नप्राशन गराउनुपर्छ, विशेष अवरोध परेमा छोराको ८ र छोरीको ७ महिनामा अन्नप्राशन गराउन सकिन्छ । २।३।५।७।१०।शु.१३ तिथि सोम, बुध, गुरु, शुक्रवार पारेर अ., रो., मृ., पु., ति., ३ उत्तरा, ह. चि. स्वा. अनु. श्र. ध. शत. रे. यी १६ नक्षत्रका दिन जन्मर्क्ष लग्नदेखि अष्टम लग्न, त्यसको नवमांशक र १।८।१२ लग्न नपारी केन्द्र, त्रिकोण, तृतीयमा शुभग्रह ३।६।११ मा पापग्रह भई दशमस्थान शुद्ध गरी शुभ बेलामा बालकलाई अन्नप्राशन गराउनू ।

  - id: karnavedha
    name: "Karnavedha (Ear piercing)"
    nameNp: "कर्णवेध (कान छेड्ने)"
    details: |
      चैत्र, पौष, तिथिक्षय, चातुर्मास, जन्ममास ४।९।१४ तिथि, जोरवर्ष, जन्मनक्षत्र छाडी जन्मदेखि १२।१६ दिन वा ६।७।८ महिनामा सोम, बुध, गुरु, शुक्रवार, अ.मृ . पु. ति.ह. चि. अनु. श्र. ध. रे. यी दश नक्षत्रमा केन्द्र त्रिकोणमा शुभग्रह गुरू, शुक्रका लग्न, राशिमा अष्टमस्थान शुद्ध गरी कर्णवेध गर्नु । (छोराको दाहिने र छोरीको देब्रे कान पहिले छेड्ने ।)

  - id: aksararambha
    name: "Aksararambha"
    nameNp: "अक्षरारम्भ"
    details: |
      उत्तरायण २।३।५।६।१०।११।१२ तिथि, सोम, बुध, गुरु, शुक्रवार अश्वि. पु. ति. अश्ले. ह. चि. स्वा. अनु. श्र. रे. नक्षत्र शुभ लग्न शुभांशकमा गणेश, सरस्वती, विष्णु, लक्ष्मीको पूजागरी अक्षरारम्भ गराउनू।

  - id: kanyavaran
    name: "Kanyavaran"
    nameNp: "कन्यावरण"
    details: |
      कृ. रो. मृ. म. ३ पूर्वा. ३ उत्तरा. ह. स्वा. अनु. श्र. मू. ध. रे. यी १७ नक्षत्र र शुभ वारमा गर्नु शुभ हुन्छ।

  - id: swayambar
    name: "Swayambar"
    nameNp: "स्वयम्वर"
    details: |
      कृ.रो.३ पूर्वा ३ उत्तरा यी नक्षत्रमा गर्नु ।

  - id: badhupravesh
    name: "Badhupravesh"
    nameNp: "बधूप्रवेश"
    details: |
