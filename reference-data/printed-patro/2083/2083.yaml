  - id: dwiragaman
    name: "Dwiragaman"
    nameNp: "द्विरागमन"
    details: |
      सम्मुख दाहिने शुक्र छाडी विषम १।३।५ वर्ष ११।१।८ महिना रवि, गुरू, शुद्धि भई सोम, बुध, गुरू, शुक्रवार ३।१२।६।७।२ लग्नमा अनु. रो. पु. ति. ३ उत्तरा ह. स्वा. वि. अनु. मू. श्र. ध. श. रे. नक्षत्रमा द्विरागमन गर्नू ।
      सम्मुख दाहिने शुक्र छाडी विषम १।३।५ वर्ष ११।१।८ महिना रवि, गुरू, शुद्धि भई सोम, बुध, गुरू, शुक्रवार ३।१२।६।७।२ लग्नमा अनु. रो. पु. ति. ३ उत्तरा ह. स्वा. वि. अनु. मू. श्र. ध. श. रे. नक्षत्रमा द्विरागमन गर्नू ।

  - id: prasuta_snan
