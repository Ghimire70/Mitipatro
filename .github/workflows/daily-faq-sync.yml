name: Daily FAQ Sync

on:
  schedule:
    - cron: '0 2 * * *'  # Daily 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-faqs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run FAQ sync
        run: npm run sync:faqs
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Commit FAQ data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/faqs/ public/data/faqs/
          if git diff --cached --quiet; then
            echo "No FAQ data changes to commit."
          else
            git commit -m "chore(faqs): daily sync — updated FAQ data shards"
            git push origin HEAD:main
          fi
